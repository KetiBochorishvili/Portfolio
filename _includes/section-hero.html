<!-- begin hero -->
<section class="hero">
  <div class="container">
    <div class="row hero__row">
      <div class="col col-8 col-d-8 col-t-12">
        <div class="hero__inner">
          <h1 class="hero__title">{{ site.data.settings.hero.hero__title }}</h1>
          <p class="hero__description">{{ site.data.settings.hero.hero__description }}</p>
        </div>
      </div>
      <div class="col col-4 col-d-4 col-t-12">
        <div class="hero__image-box">
          <img class="hero__image" src="{{ site.baseurl }}/images/self.png" alt="{{ site.data.settings.author }}">
        </div>
      </div>
    </div>
  </div>
</section>
<!-- end hero -->
